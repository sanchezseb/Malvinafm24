<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video y Radio Sincronizados</title>
    <link rel="stylesheet" href="styles.css">
<style type="text/css" id="dcoder_stylesheet">body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #f0f0f0;
    overflow: hidden;
}
.video-container {
    position: relative;
    width: 80%;
    padding-bottom: 45%; /* Ajuste de proporción */
    height: 0;
    margin-bottom: 10px; /* Separación entre video y botones */
}
.video-container iframe {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}
.video-container .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: transparent;
    pointer-events: none;
}
.video-container:hover .overlay {
    display: none;
}
.image-container {
    position: absolute;
    bottom: -2px; /* Ajuste de posición para mover la imagen hacia abajo */
    right: 20px;
}
.image-container img {
    width: 100px;
    height: auto;
}
.button-container {
    display: flex;
    gap: 10px; /* Espacio entre los botones */
}
button {
    padding: 10px 20px;
    font-size: 16px;
}
@media (max-width: 600px) {
    .video-container {
        width: 100%;
        padding-bottom: 56.25%; /* Ajuste de proporción para móviles */
    }
    .image-container img {
        width: 50px; /* Ajuste de tamaño de imagen para móviles */
    }
    button {
        padding: 5px 10px; /* Ajuste de tamaño de botones para móviles */
    }
}</style></head>
<body>
    <div class="video-container" id="videoContainer">
        <iframe id="video" src="https://www.youtube.com/embed/uAzUAZEKVJI?si=DUq1ZeERntb0yCGl&amp;mute=1&amp;enablejsapi=1&amp;controls=0&amp;modestbranding=1&amp;rel=0" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <div class="overlay"></div>
        <div class="image-container">
            <img src="https://i.imgur.com/Mx8rzbP.jpeg" alt="Logo">
        </div>
    </div>
    <div class="button-container">
        <button id="playButton">Reproducir</button>
        <button id="fullscreenButton">Pantalla Completa</button>
    </div>
    <script src="scripts.js"></script>

<script type="text/javascript" id="dcoder_script">const radioURL = "https://stream.zeno.fm/iq6cpwxoi0quv";
const radio = new Audio(radioURL);
radio.loop = true;

const video = document.getElementById('video');
const videoContainer = document.getElementById('videoContainer');
const playButton = document.getElementById('playButton');
const fullscreenButton = document.getElementById('fullscreenButton');

const playMedia = () => {
    video.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
    radio.play();
};

const pauseMedia = () => {
    video.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
    radio.pause();
};

playButton.addEventListener('click', () => {
    if (radio.paused) {
        playMedia();
        playButton.textContent = 'Pausar';
    } else {
        pauseMedia();
        playButton.textContent = 'Reproducir';
    }
});

fullscreenButton.addEventListener('click', () => {
    if (videoContainer.requestFullscreen) {
        videoContainer.requestFullscreen();
    } else if (videoContainer.mozRequestFullScreen) { /* Firefox */
        videoContainer.mozRequestFullScreen();
    } else if (videoContainer.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
        videoContainer.webkitRequestFullscreen();
    } else if (videoContainer.msRequestFullscreen) { /* IE/Edge */
        videoContainer.msRequestFullscreen();
    } else if (videoContainer.webkitEnterFullscreen) { /* iOS Safari */
        videoContainer.webkitEnterFullscreen();
    } else {
        console.log("Pantalla completa no es soportada por este navegador.");
    }
});

window.addEventListener('message', (event) => {
    if (event.origin !== "https://www.youtube.com") return;

    if (event.data && event.data.event === 'infoDelivery' && event.data.info) {
        const playerState = event.data.info.playerState;

        if (playerState === 2) {
            playMedia();
        }
    }
});

setInterval(() => {
    video.contentWindow.postMessage('{"event":"command","func":"getPlayerState","args":""}', '*');
}, 1000);</script></body></html>
